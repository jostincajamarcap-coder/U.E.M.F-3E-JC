<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3 en raya vs Bot</title>
    <style>
      :root {
        font-family: Arial, Helvetica, sans-serif;
        color: #e2e8f0;
        background: #0f172a;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1e293b, #020617 60%);
      }
      .app {
        width: min(92vw, 520px);
        padding: 1.5rem;
        border-radius: 16px;
        background: rgba(15, 23, 42, 0.9);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin-top: 0;
        text-align: center;
      }
      .status {
        text-align: center;
        margin-bottom: 1rem;
        min-height: 1.5rem;
      }
      .board {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.5rem;
      }
      .cell {
        aspect-ratio: 1 / 1;
        border: none;
        border-radius: 12px;
        font-size: clamp(1.8rem, 7vw, 2.6rem);
        font-weight: bold;
        color: #f8fafc;
        background: #1e293b;
        cursor: pointer;
      }
      .cell:hover:not(:disabled) {
        background: #334155;
      }
      .cell:disabled {
        cursor: default;
        opacity: 0.95;
      }
      .actions {
        margin-top: 1rem;
        display: flex;
        justify-content: center;
      }
      .btn {
        padding: 0.65rem 1rem;
        border-radius: 8px;
        border: none;
        background: #38bdf8;
        color: #082f49;
        font-weight: 700;
        cursor: pointer;
      }
      dialog {
        border: none;
        border-radius: 12px;
        max-width: 420px;
        width: calc(100% - 2rem);
        background: #0f172a;
        color: #e2e8f0;
      }
      dialog::backdrop {
        background: rgba(2, 6, 23, 0.75);
      }
      .question-form {
        display: grid;
        gap: 0.75rem;
      }
      input {
        padding: 0.5rem;
        border-radius: 8px;
        border: 1px solid #475569;
        background: #1e293b;
        color: #e2e8f0;
      }
      .feedback {
        min-height: 1.2rem;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <h1>3 en raya contra el Bot</h1>
      <p class="status" id="status">Tu turno (X)</p>
      <section class="board" id="board" aria-label="Tablero de 3 en raya"></section>
      <div class="actions">
        <button class="btn" id="resetBtn">Reiniciar partida</button>
      </div>
    </main>

    <dialog id="questionDialog">
      <h2>¡Perdiste! Responde para continuar</h2>
      <form class="question-form" id="questionForm" method="dialog">
        <p id="questionText"></p>
        <input id="answerInput" type="text" autocomplete="off" required />
        <div class="feedback" id="feedback"></div>
        <button class="btn" type="submit">Comprobar respuesta</button>
      </form>
    </dialog>

    <script>
      const boardElement = document.getElementById('board');
      const statusElement = document.getElementById('status');
      const resetBtn = document.getElementById('resetBtn');
      const questionDialog = document.getElementById('questionDialog');
      const questionForm = document.getElementById('questionForm');
      const questionText = document.getElementById('questionText');
      const answerInput = document.getElementById('answerInput');
      const feedback = document.getElementById('feedback');

      const player = 'X';
      const bot = 'O';
      const winPatterns = [
        [0, 1, 2],
        [3, 4, 5],
        [6, 7, 8],
        [0, 3, 6],
        [1, 4, 7],
        [2, 5, 8],
        [0, 4, 8],
        [2, 4, 6]
      ];
      const questions = [
        { q: '¿Cuánto es 7 + 6?', a: '13' },
        { q: '¿Cuánto es 9 × 3?', a: '27' },
        { q: 'Si todos los gatos son mamíferos y Mishi es gato, ¿Mishi es mamífero? (sí/no)', a: 'sí' },
        { q: '¿Cuál es el siguiente número? 2, 4, 8, 16, ...', a: '32' },
        { q: '¿Cuánto es 15 - 9?', a: '6' }
      ];

      let board = Array(9).fill('');
      let gameActive = true;
      let currentQuestion = null;

      function createBoard() {
        boardElement.innerHTML = '';
        board.forEach((_, index) => {
          const cell = document.createElement('button');
          cell.className = 'cell';
          cell.dataset.index = index;
          cell.addEventListener('click', () => handlePlayerMove(index));
          boardElement.appendChild(cell);
        });
        renderBoard();
      }

      function renderBoard() {
        const cells = [...boardElement.children];
        cells.forEach((cell, index) => {
          cell.textContent = board[index];
          cell.disabled = !gameActive || board[index] !== '';
        });
      }

      function checkWinner(symbol) {
        return winPatterns.some((pattern) => pattern.every((index) => board[index] === symbol));
      }

      function isDraw() {
        return board.every((cell) => cell !== '');
      }

      function availableMoves() {
        return board.map((value, index) => (value === '' ? index : null)).filter((v) => v !== null);
      }

      function findWinningMove(symbol) {
        for (const pattern of winPatterns) {
          const values = pattern.map((index) => board[index]);
          const filled = values.filter((value) => value === symbol).length;
          const emptyIndex = pattern.find((index) => board[index] === '');
          if (filled === 2 && emptyIndex !== undefined) {
            return emptyIndex;
          }
        }
        return null;
      }

      function botMove() {
        if (!gameActive) return;

        const winningMove = findWinningMove(bot);
        const blockMove = findWinningMove(player);
        const freeMoves = availableMoves();
        const preferredMoves = [4, 0, 2, 6, 8, 1, 3, 5, 7];

        const strategicMove = preferredMoves.find((move) => freeMoves.includes(move));
        const move = winningMove ?? blockMove ?? strategicMove ?? freeMoves[0];

        if (move === undefined) return;
        board[move] = bot;

        if (checkWinner(bot)) {
          statusElement.textContent = 'El bot ganó. Debes responder una pregunta.';
          gameActive = false;
          renderBoard();
          askQuestion();
          return;
        }

        if (isDraw()) {
          statusElement.textContent = 'Empate. ¡Buena partida!';
          gameActive = false;
          renderBoard();
          return;
        }

        statusElement.textContent = 'Tu turno (X)';
        renderBoard();
      }

      function handlePlayerMove(index) {
        if (!gameActive || board[index] !== '') return;

        board[index] = player;
        if (checkWinner(player)) {
          statusElement.textContent = '¡Ganaste!';
          gameActive = false;
          renderBoard();
          return;
        }

        if (isDraw()) {
          statusElement.textContent = 'Empate. ¡Buena partida!';
          gameActive = false;
          renderBoard();
          return;
        }

        statusElement.textContent = 'Turno del bot...';
        renderBoard();
        setTimeout(botMove, 450);
      }

      function normalizeAnswer(value) {
        return value.trim().toLowerCase();
      }

      function askQuestion() {
        currentQuestion = questions[Math.floor(Math.random() * questions.length)];
        questionText.textContent = currentQuestion.q;
        answerInput.value = '';
        feedback.textContent = '';
        questionDialog.showModal();
      }

      questionForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const userAnswer = normalizeAnswer(answerInput.value);
        const expected = normalizeAnswer(currentQuestion.a);

        if (userAnswer === expected || (expected === 'sí' && userAnswer === 'si')) {
          feedback.textContent = '✅ Correcto. Puedes volver a jugar.';
          setTimeout(() => {
            questionDialog.close();
            resetGame();
          }, 600);
        } else {
          feedback.textContent = '❌ Respuesta incorrecta. Inténtalo de nuevo.';
        }
      });

      function resetGame() {
        board = Array(9).fill('');
        gameActive = true;
        statusElement.textContent = 'Tu turno (X)';
        createBoard();
      }

      resetBtn.addEventListener('click', resetGame);
      createBoard();
    </script>
  </body>
</html>
